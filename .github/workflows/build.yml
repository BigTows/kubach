# Release builds for Linux, macOS and Windows, x64 and arm64.
#
# Every push to main: packages as run artifacts. When the workspace version
# in Cargo.toml (e.g. 2026.10.1) has no tag yet, the run also creates that
# tag and a GitHub Release with the packages, the AUR PKGBUILD and
# SHA256SUMS. So a release is a commit that bumps the version.
#
# macOS signing is optional. Without these secrets the app gets an ad-hoc
# signature: it runs (after "Open" in Finder), but Touch ID unlock is
# unavailable and the vault asks for the password (ADR 0008).
#   MACOS_CERTIFICATE_P12        base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD   its password
#   MACOS_PROVISIONING_PROFILE   base64 of a Developer ID .provisionprofile
#                                for the app id (keychain-access-groups)
# Notarization, so Gatekeeper opens the app without a warning (App Store
# Connect API key with the Developer role):
#   APPLE_API_KEY_P8             base64 of AuthKey_<id>.p8
#   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs queue instead of cancelling each other: a cancelled run could leave
# a release half uploaded.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.41.1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Version and whether it is released
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            release=false
          elif git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "$version is already released"
            release=false
          else
            echo "$version has no tag yet: releasing"
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binary runs on older distributions too.
          - { runner: ubuntu-22.04, arch: x86_64, nfpm: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, nfpm: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kubach-app
      - name: Packaging tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm }}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" nfpm
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Shared libraries
        run: ldd target/release/kubach
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kubach-linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_PROVISIONING_PROFILE != '' }}
      NOTARIZE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kubach-app
      - name: Signing keychain
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/kubach.provisionprofile"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Bundle (signed)
        if: env.SIGNED == 'true'
        run: scripts/bundle-macos.sh --profile "$RUNNER_TEMP/kubach.provisionprofile" --dmg
      - name: Bundle (unsigned)
        if: env.SIGNED != 'true'
        run: scripts/bundle-macos.sh --unsigned --dmg
      - name: Notarize
        if: env.SIGNED == 'true' && env.NOTARIZE == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          for dmg in target/dist/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
            # The ticket reaches CloudKit a little after "Accepted", and the
            # lookup sometimes drops the connection: retry. An unstapled but
            # notarized dmg still opens; Gatekeeper fetches the ticket online.
            for attempt in 1 2 3 4 5; do
              xcrun stapler staple "$dmg" && break
              if [ "$attempt" = 5 ]; then
                echo "::warning::stapling $dmg failed; it is notarized, Gatekeeper checks the ticket online"
              else
                sleep $((attempt * 20))
              fi
            done
          done
          rm "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: kubach-macos-${{ matrix.arch }}
          path: target/dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $triple = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$triple/rustup-init.exe" -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
      # ring needs clang for aarch64-pc-windows-msvc.
      - name: LLVM
        if: matrix.arch == 'arm64'
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) { choco install llvm -y --no-progress }
            'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p kubach-app
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --global wix --version 5.0.2
      - run: scripts/package-windows.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: kubach-windows-${{ matrix.arch }}
          path: |
            target/dist/*.zip
            target/dist/*.msi
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: PKGBUILD and checksums
        run: |
          sum() { sha256sum "dist/kubach-$VERSION-linux-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$VERSION/" \
              -e "s/@SHA256_X86_64@/$(sum x86_64)/" \
              -e "s/@SHA256_AARCH64@/$(sum aarch64)/" \
              packaging/arch/PKGBUILD > dist/PKGBUILD
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      # The release text is the description of the develop → main pull
      # request merged here; without one, GitHub's generated notes. Either
      # way it ends with the code signing line SignPath Foundation requires
      # on the download page (GitHub puts the body before generated notes).
      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")][0].body // ""' > "$RUNNER_TEMP/notes.md" || true
          if [ -s "$RUNNER_TEMP/notes.md" ] && grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            printf '\n\n---\n\n' >> "$RUNNER_TEMP/notes.md"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/notes.md"
          fi
          printf 'Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).\n' >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      # Creates the tag on this commit. Tags made with GITHUB_TOKEN don't
      # start another run.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Kubach ${{ env.VERSION }}
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: ${{ steps.notes.outputs.generated == 'true' }}
          fail_on_unmatched_files: true
