# Release builds for Linux, macOS and Windows, x64 and arm64.
#
# Every push to main: packages as run artifacts. When the workspace version
# in Cargo.toml (e.g. 2026.10.1) has no tag yet, the run also creates that
# tag and a GitHub Release with the packages, the AUR PKGBUILD and
# SHA256SUMS, and a build provenance attestation for each of these files
# (`gh attestation verify <file> --repo <owner>/<repo>`). So a release is a
# commit that bumps the version.
#
# A manual run (workflow_dispatch) from another branch is a test build: the
# macOS app gets an ad-hoc signature and nothing is published. Signing and
# the release only happen on main.
#
# macOS signing is optional. Without these secrets the app gets an ad-hoc
# signature: it runs (after "Open" in Finder), but Touch ID unlock is
# unavailable and the vault asks for the password (ADR 0008). The secrets
# belong to the `release` environment (deployment branches: main only), and
# only the `macos` job, which declares that environment, reads them. That
# job runs no build and no third-party action: it takes the binary from
# `macos-build`.
#   MACOS_CERTIFICATE_P12        base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD   its password
#   MACOS_PROVISIONING_PROFILE   base64 of a Developer ID .provisionprofile
#                                for the app id (keychain-access-groups)
# Notarization, so Gatekeeper opens the app without a warning (App Store
# Connect API key with the Developer role):
#   APPLE_API_KEY_P8             base64 of AuthKey_<id>.p8
#   APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
#
# Actions are pinned to a commit; Dependabot moves the pins. No job here
# restores a build cache: a release is built from the sources and
# Cargo.lock alone. Downloaded tools have a fixed version and a SHA-256
# written below: when a version changes, its hashes change with it.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Runs queue instead of cancelling each other: a cancelled run could leave
# a release half uploaded.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Each job states what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.41.1
  APPIMAGETOOL_VERSION: 1.9.1
  # The runtime appimagetool puts at the start of every AppImage: a release
  # of AppImage/type2-runtime.
  APPIMAGE_RUNTIME_VERSION: '20251108'
  # Windows: only installed when the runner image has none.
  RUSTUP_VERSION: 1.29.3
  LLVM_VERSION: 23.1.3
  LLVM_SHA256: 5153f848ac87553118340f16f8d3cd4351d729bcba6e4785c6a4a9af29676de9

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: Version and whether it is released
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            release=false
          else
            # ls-remote exits with 2 when no such tag exists; anything else
            # is a failed lookup, and that must not start a release.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null || status=$?
            if [ "$status" = 0 ]; then
              echo "$version is already released"
              release=false
            elif [ "$status" = 2 ]; then
              echo "$version has no tag yet: releasing"
              release=true
            else
              echo "::error::looking up the tag $version failed (git ls-remote: $status)"
              exit 1
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binary runs on older distributions too.
          - runner: ubuntu-22.04
            arch: x86_64
            nfpm: x86_64
            nfpm_sha256: b3cf95aa6dabed836d09ad7f0c190a13c74c5b1304db60846f0f702ee407f430
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - runner: ubuntu-22.04-arm
            arch: aarch64
            nfpm: arm64
            nfpm_sha256: 17350a838c8e2c422c6e573ed379b18424565d2de8a2b1cb1b20211976124eb5
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      # The action has no releases: the pin is a commit of its master branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kubach-app
      - name: Packaging tools
        env:
          NFPM_ARCH: ${{ matrix.nfpm }}
          ARCH: ${{ matrix.arch }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          APPIMAGETOOL_SHA256: ${{ matrix.appimagetool_sha256 }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          curl -fsSL -o appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-${ARCH}"
          printf '%s  %s\n' \
            "$NFPM_SHA256" nfpm.tar.gz \
            "$APPIMAGETOOL_SHA256" appimagetool \
            "$RUNTIME_SHA256" appimage-runtime > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          tar -xzf nfpm.tar.gz -C "$RUNNER_TEMP/bin" nfpm
          install -m 755 appimagetool "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # package-linux.sh hands it to appimagetool, which otherwise
          # downloads the latest runtime build itself.
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/tools/appimage-runtime" >> "$GITHUB_ENV"
      - name: Shared libraries
        run: ldd target/release/kubach
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubach-linux-${{ matrix.arch }}
          path: target/dist/*
          if-no-files-found: error

  # Builds the macOS binary; no secrets here. On main the `macos` job signs
  # and packs it. On another branch (a manual test build) this job packs it
  # itself, with an ad-hoc signature.
  macos-build:
    name: macOS ${{ matrix.arch }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action has no releases: the pin is a commit of its master branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - run: cargo build --release --locked -p kubach-app
      - name: Binary for the signing job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos-${{ matrix.arch }}
          path: target/release/kubach
          if-no-files-found: error
      - name: Bundle (test build, ad-hoc signature)
        if: github.ref != 'refs/heads/main'
        run: scripts/bundle-macos.sh --no-build --unsigned --dmg
      - if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubach-macos-${{ matrix.arch }}
          path: target/dist/*.dmg
          if-no-files-found: error

  # Signs, notarizes and packs the binary from `macos-build`. The only job
  # that reads the signing secrets: main only, in the `release` environment.
  # Keep it free of third-party actions, builds and cache restores.
  macos:
    name: macOS ${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    needs: macos-build
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_PROVISIONING_PROFILE != '' }}
      NOTARIZE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-macos-${{ matrix.arch }}
          path: target/release
      # Artifacts don't keep the executable bit.
      - run: chmod 755 target/release/kubach
      - name: Signing keychain
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/kubach.provisionprofile"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
      - name: Bundle (signed)
        if: env.SIGNED == 'true'
        run: scripts/bundle-macos.sh --no-build --profile "$RUNNER_TEMP/kubach.provisionprofile" --dmg
      - name: Bundle (unsigned)
        if: env.SIGNED != 'true'
        run: scripts/bundle-macos.sh --no-build --unsigned --dmg
      - name: Notarize
        if: env.SIGNED == 'true' && env.NOTARIZE == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          for dmg in target/dist/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
            # The ticket reaches CloudKit a little after "Accepted", and the
            # lookup sometimes drops the connection: retry. An unstapled but
            # notarized dmg still opens; Gatekeeper fetches the ticket online.
            for attempt in 1 2 3 4 5; do
              xcrun stapler staple "$dmg" && break
              if [ "$attempt" = 5 ]; then
                echo "::warning::stapling $dmg failed; it is notarized, Gatekeeper checks the ticket online"
              else
                sleep $((attempt * 20))
              fi
            done
          done
          rm "$RUNNER_TEMP/AuthKey.p8"
      # Runs after a failed step too, and before anything else in the job.
      - name: Remove the keychain and key files
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/kubach.provisionprofile" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubach-macos-${{ matrix.arch }}
          path: target/dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            rustup_sha256: 38027d51d69a5d05493627a0634dbea52d6cd793c8f072d2373d3f4163eec7db
          - runner: windows-11-arm
            arch: arm64
            rustup_sha256: 407e0d72f81d26a01f9d032b8317908cbb2917ba22765474b682b41390792ad9
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        env:
          RUSTUP_SHA256: ${{ matrix.rustup_sha256 }}
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $triple = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
            $installer = "$env:RUNNER_TEMP\rustup-init.exe"
            Invoke-WebRequest "https://static.rust-lang.org/rustup/archive/$env:RUSTUP_VERSION/$triple/rustup-init.exe" -OutFile $installer
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
            if ($hash -ne $env:RUSTUP_SHA256) { throw "rustup-init.exe: SHA-256 is $hash, expected $env:RUSTUP_SHA256" }
            & $installer -y --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
      # ring needs clang for aarch64-pc-windows-msvc. The installer is the
      # x64 one, as before: it runs on arm64 Windows.
      - name: LLVM
        if: matrix.arch == 'arm64'
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) {
              $ProgressPreference = 'SilentlyContinue'
              $installer = "$env:RUNNER_TEMP\llvm.msi"
              Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile $installer
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash
              if ($hash -ne $env:LLVM_SHA256) { throw "llvm.msi: SHA-256 is $hash, expected $env:LLVM_SHA256" }
              $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "`"$installer`"", '/qn', '/norestart'
              if ($install.ExitCode -notin 0, 1641, 3010) { throw "LLVM installer: exit code $($install.ExitCode)" }
              if (-not (Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) { throw 'LLVM installer: no C:\Program Files\LLVM\bin\clang.exe' }
            }
            'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - run: cargo build --release --locked -p kubach-app
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --global wix --version 5.0.2
      - run: scripts/package-windows.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubach-windows-${{ matrix.arch }}
          path: |
            target/dist/*.zip
            target/dist/*.msi
          if-no-files-found: error

  # Publishes with the workflow's own token: only GitHub's actions and the
  # gh CLI of the runner image here.
  release:
    if: github.ref == 'refs/heads/main' && needs.version.outputs.release == 'true'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      # The attestation.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The packages; not the unsigned macOS binaries (unsigned-macos-*).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: kubach-*
          merge-multiple: true
      - name: PKGBUILD and checksums
        run: |
          sum() { sha256sum "dist/kubach-$VERSION-linux-$1.tar.gz" | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$VERSION/" \
              -e "s/@SHA256_X86_64@/$(sum x86_64)/" \
              -e "s/@SHA256_AARCH64@/$(sum aarch64)/" \
              packaging/arch/PKGBUILD > dist/PKGBUILD
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      # The release text is the description of the develop → main pull
      # request merged here; without one, GitHub's generated notes.
      - name: Release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")][0].body // ""' > "$RUNNER_TEMP/notes.md" || true
          if [ -s "$RUNNER_TEMP/notes.md" ] && grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # Creates the tag on this commit. Tags made with GITHUB_TOKEN don't
      # start another run. gh uploads the files to a draft and publishes it
      # last; a rerun after a failed upload finds that draft and finishes it.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GENERATED: ${{ steps.notes.outputs.generated }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --draft=false
          elif [ "$GENERATED" = false ]; then
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
              --title "Kubach $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
              --title "Kubach $VERSION" --generate-notes
          fi
