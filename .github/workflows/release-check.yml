# Checks for a release pull request: develop -> main.
#
# Features go to develop; main only takes pull requests from develop, and
# every push to main is a release (build.yml). Here the version must be a new
# one, and fmt, clippy and tests must pass on each OS. Only x64: the code is
# the same on arm64, and build.yml builds those after the merge. All three
# OS are needed because of #[cfg(target_os)] code (Touch ID, clipboard).
#
# Actions are pinned to a commit; Dependabot moves the pins.
name: Release check

on:
  pull_request:
    branches: [main]

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Each job states what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source branch, version format and tag
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != develop ]; then
            echo "::error::main only takes pull requests from develop, not $HEAD_REF"
            exit 1
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "Version: $version"
          # YEAR.MONTH.INC, month without a leading zero, INC from 1.
          if ! echo "$version" | grep -Eq '^[0-9]{4}\.([1-9]|1[0-2])\.[1-9][0-9]*$'; then
            echo "::error file=Cargo.toml::$version is not YYYY.M.N"
            exit 1
          fi
          if [ "${version%.*}" != "$(date -u +%Y.%-m)" ]; then
            echo "::error file=Cargo.toml::$version is not this month ($(date -u +%Y.%-m).N)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "::error file=Cargo.toml::$version is already released: bump the version"
            exit 1
          fi
          latest="$(git tag --list '[0-9]*.*.*' --sort=-v:refname | head -1)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error file=Cargo.toml::$version is lower than the last release $latest"
            exit 1
          fi
          echo "Last release: ${latest:-none}"

  check:
    name: Release check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      # The action has no releases: the pin is a commit of its master branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Reads develop's cache (Linux, check.yml) and saves none: a pull
      # request's cache serves only itself and crowds the 10 GB limit (#95).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every crate's tests run even when one fails, so one run shows all.
      - run: cargo test --workspace --locked --no-fail-fast
