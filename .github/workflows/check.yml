# Checks for pull requests into develop, Dependabot's among them: fmt,
# clippy and tests on Linux only, to stay fast. The three-OS run is on the
# release pull request (release-check.yml).
#
# Pushes to develop run it too: rust-cache only shares caches from the base
# branch with pull requests, so this keeps their cache warm.
name: Check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Develop check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
