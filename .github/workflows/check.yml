# Checks for pull requests into develop, Dependabot's among them: fmt,
# clippy and tests on Linux only, to stay fast. The three-OS run is on the
# release pull request (release-check.yml).
#
# Pushes to develop run it too: rust-cache only shares caches from the base
# branch with pull requests, so this keeps their cache warm. Only those
# pushes save the cache: a pull request's cache is seen by that pull request
# alone and would crowd develop's out of the 10 GB limit (#95).
#
# Actions are pinned to a commit; Dependabot moves the pins.
name: Check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Each job states what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Develop check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      # The action has no releases: the pin is a commit of its master branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
