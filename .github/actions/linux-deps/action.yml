name: Linux build dependencies
description: System packages GPUI needs to build Kubach on Debian/Ubuntu (the list in README).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential pkg-config \
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
          libx11-dev libx11-xcb-dev libxcb1-dev \
          libfontconfig-dev libfreetype-dev libvulkan-dev \
          libssl-dev libzstd-dev
