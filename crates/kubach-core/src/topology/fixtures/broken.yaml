metadata: {name: web, namespace: broken}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      serviceAccountName: robot
      containers:
        - name: web
          image: web
          env:
            - name: A
              valueFrom: {configMapKeyRef: {name: nope, key: a}}
            - name: B
              valueFrom: {secretKeyRef: {name: maybe, key: b, optional: true}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gone}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-9-x
  namespace: broken
  labels: {app: web, pod-template-hash: "9"}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: web-9, uid: r, controller: true}]
spec:
  serviceAccountName: robot
  containers:
    - name: web
      image: web
      env:
        - name: A
          valueFrom: {configMapKeyRef: {name: nope, key: a}}
        - name: B
          valueFrom: {secretKeyRef: {name: maybe, key: b, optional: true}}
