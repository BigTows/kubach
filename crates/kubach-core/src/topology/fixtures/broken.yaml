# Dangling references of every kind.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: front, namespace: broken}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: ghost, port: {number: 80}}}
          - path: /web
            pathType: Prefix
            backend: {service: {name: web, port: {number: 9090}}}
          - path: /named
            pathType: Prefix
            backend: {service: {name: web, port: {name: https}}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: broken}
spec:
  selector: {app: web}
  ports: [{name: http, port: 80}]
---
apiVersion: v1
