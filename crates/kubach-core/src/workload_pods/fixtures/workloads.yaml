apiVersion: batch/v1
kind: Job
metadata: {name: report, namespace: shop, uid: j-report}
spec:
  selector: {matchLabels: {batch.kubernetes.io/controller-uid: j-report}}
  template: {spec: {restartPolicy: Never, containers: [{name: report, image: busybox}]}}
---
apiVersion: v1
kind: Pod
metadata:
  name: report-abc
  namespace: shop
  uid: p-report-abc
  creationTimestamp: "2026-10-25T07:00:00Z"
  labels: {batch.kubernetes.io/controller-uid: j-report, job-name: report}
  ownerReferences: [{apiVersion: batch/v1, kind: Job, name: report, uid: j-report, controller: true}]
spec: {nodeName: node-b, restartPolicy: Never, containers: [{name: report, image: busybox}]}
status:
  phase: Succeeded
  containerStatuses:
    - name: report
      image: busybox
      imageID: ""
      ready: false
      restartCount: 0
      state: {terminated: {reason: Completed, exitCode: 0}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: nightly, namespace: shop, uid: cj-nightly}
spec:
  schedule: "* * * * *"
  jobTemplate: {spec: {template: {spec: {restartPolicy: Never, containers: [{name: n, image: busybox}]}}}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-29000000
  namespace: shop
  uid: j-nightly-1
  ownerReferences: [{apiVersion: batch/v1, kind: CronJob, name: nightly, uid: cj-nightly, controller: true}]
