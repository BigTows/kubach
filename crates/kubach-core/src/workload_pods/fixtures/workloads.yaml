metadata:
  name: agent-q2
  namespace: shop
  uid: p-agent-q2
  creationTimestamp: "2026-10-25T08:00:00Z"
  labels: {app: agent}
  ownerReferences: [{apiVersion: apps/v1, kind: DaemonSet, name: agent, uid: ds-agent, controller: true}]
