  namespace: shop
  uid: p-db-10
  labels: {app: db}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: db, uid: s-db, controller: true}]
spec: {nodeName: node-a, containers: [{name: db, image: postgres}]}
