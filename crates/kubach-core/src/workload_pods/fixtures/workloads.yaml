  creationTimestamp: "2026-10-25T06:01:00Z"
  ownerReferences: [{apiVersion: batch/v1, kind: Job, name: nightly-29000001, uid: j-nightly-2, controller: true}]
spec: {nodeName: node-a, restartPolicy: Never, containers: [{name: n, image: busybox}]}
---
# A Job named like a CronJob's, of no CronJob: the name fallback takes
# only the exact `<cronjob>-<digits>` shape.
apiVersion: v1
kind: Pod
metadata:
  name: nightly-backup-k3
  namespace: shop
  uid: p-nightly-backup
  creationTimestamp: "2026-10-25T06:02:00Z"
  ownerReferences: [{apiVersion: batch/v1, kind: Job, name: nightly-backup, uid: j-backup, controller: true}]
spec: {containers: [{name: n, image: busybox}]}
