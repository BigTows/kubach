# Workloads of one namespace and their pods, as the API lists them.
# Deployment web → ReplicaSets web-1 (old), web-2 → pods; Deployment api
# shares web's labels (an overlapping selector) through ReplicaSet api-1.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop, uid: d-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template: {metadata: {labels: {app: web}}, spec: {containers: [{name: web, image: nginx}]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop, uid: d-api}
spec:
  selector: {matchLabels: {app: web}}
  template: {metadata: {labels: {app: web}}, spec: {containers: [{name: api, image: api}]}}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-1
  namespace: shop
  uid: rs-web-1
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: web, uid: d-web, controller: true}]
spec: {selector: {matchLabels: {app: web, pod-template-hash: "1"}}}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: web-2
  namespace: shop
  uid: rs-web-2
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: web, uid: d-web, controller: true}]
spec: {selector: {matchLabels: {app: web, pod-template-hash: "2"}}}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: api-1
  namespace: shop
  uid: rs-api-1
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: api, uid: d-api, controller: true}]
spec: {selector: {matchLabels: {app: web}}}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-1-aaa
  namespace: shop
  uid: p-web-1-aaa
  resourceVersion: "10"
  creationTimestamp: "2026-10-25T10:00:00Z"
  labels: {app: web, pod-template-hash: "1"}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: web-1, uid: rs-web-1, controller: true}]
spec: {nodeName: node-a, containers: [{name: web, image: nginx}]}
status:
  phase: Running
  conditions: [{type: Ready, status: "True"}]
  containerStatuses: [{name: web, image: nginx, imageID: "", ready: true, restartCount: 0, state: {running: {}}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: web-2-bbb
  namespace: shop
  uid: p-web-2-bbb
  resourceVersion: "11"
  creationTimestamp: "2026-10-25T10:05:00Z"
  labels: {app: web, pod-template-hash: "2"}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: web-2, uid: rs-web-2, controller: true}]
spec: {nodeName: node-b, containers: [{name: web, image: nginx}]}
status:
  phase: Running
  containerStatuses:
    - name: web
      image: nginx
      imageID: ""
      ready: false
      restartCount: 3
      state: {waiting: {reason: CrashLoopBackOff}}
---
apiVersion: v1
kind: Pod
metadata:
  name: web-2-ccc
  namespace: shop
  uid: p-web-2-ccc
  resourceVersion: "12"
  creationTimestamp: "2026-10-25T10:06:00Z"
  labels: {app: web, pod-template-hash: "2"}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: web-2, uid: rs-web-2, controller: true}]
spec: {containers: [{name: web, image: nginx}]}
status: {phase: Pending}
---
apiVersion: v1
kind: Pod
metadata:
  name: api-1-xxx
  namespace: shop
  uid: p-api-1-xxx
  creationTimestamp: "2026-10-25T09:00:00Z"
  labels: {app: web}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: api-1, uid: rs-api-1, controller: true}]
spec: {nodeName: node-a, containers: [{name: api, image: api}]}
status: {phase: Running}
---
# Another namespace: never a pod of the workloads above.
apiVersion: v1
kind: Pod
metadata:
  name: web-2-zzz
  namespace: other
  uid: p-other
  creationTimestamp: "2026-10-25T10:07:00Z"
  labels: {app: web, pod-template-hash: "2"}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: web-2, uid: rs-web-2, controller: true}]
spec: {containers: [{name: web, image: nginx}]}
---
