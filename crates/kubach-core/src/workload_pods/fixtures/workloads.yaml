  namespace: shop
  uid: p-nightly-1
  creationTimestamp: "2026-10-25T06:00:00Z"
  ownerReferences: [{apiVersion: batch/v1, kind: Job, name: nightly-29000000, uid: j-nightly-1, controller: true}]
