# Multi-source Helm chart with values from Git, drifted from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 4.1.0
      helm:
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: https://git.example.com/acme/platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
status:
  sync:
    status: OutOfSync
    revisions:
      - 4.1.0
      - 2b8d0c1
  health:
    status: Healthy
  reconciledAt: "2026-10-22T10:00:00Z"
  sourceTypes:
    - Helm
    - Directory
---
