[package]
name = "kubach-mcp"
description = "MCP server for AI agents, confined to a namespace and a profile (ADR 0005)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kubach-core.workspace = true
axum.workspace = true
base64.workspace = true
futures.workspace = true
http.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
rmcp.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "sync", "time"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
