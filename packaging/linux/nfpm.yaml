# .deb, .rpm and Arch .pkg.tar.zst from the /usr tree scripts/package-linux.sh
# stages; nfpm runs in it, so sources are relative. $ARCH is amd64 or arm64;
# nfpm names it per format (x86_64/aarch64 for rpm and Arch).
name: kubach
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: devel
priority: optional
maintainer: ${MAINTAINER}
description: Kubernetes IDE
vendor: Kubach
homepage: https://github.com/BigTows/kubach
license: MIT

contents:
  - src: ./usr/bin/kubach
    dst: /usr/bin/kubach
    file_info:
      mode: 0755
  - src: ./usr/share/applications/dev.kubach.app.desktop
    dst: /usr/share/applications/dev.kubach.app.desktop
  - src: ./usr/share/icons/hicolor/512x512/apps/dev.kubach.app.png
    dst: /usr/share/icons/hicolor/512x512/apps/dev.kubach.app.png
  - src: ./usr/share/icons/hicolor/scalable/apps/dev.kubach.app.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.kubach.app.svg
  - src: ./usr/share/licenses/kubach/LICENSE
    dst: /usr/share/licenses/kubach/LICENSE

# Linked (ldd): libxcb, xkbcommon and xkbcommon-x11. Not linked, but
# loaded at runtime (dlopen) or kept for desktop font setup: Wayland,
# Vulkan, fontconfig and freetype.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libwayland-client0
      - libfontconfig1
      - libfreetype6
      - libvulkan1
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - libwayland-client
      - fontconfig
      - freetype
      - vulkan-loader
  archlinux:
    depends:
      - libxkbcommon-x11
      - libxcb
      - wayland
      - fontconfig
      - freetype2
      - vulkan-icd-loader
